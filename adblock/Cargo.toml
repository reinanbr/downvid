[package]
name = "dvadblock"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "DownVid's ad blocker: Brave's adblock-rust engine behind a small JNI API"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Host tool: compiles the filter lists into the engine file shipped as an
# asset, and assembles the scriptlet/redirect resources.
name = "dvadblock-compile"
path = "src/bin/compile.rs"
required-features = ["tools"]

[features]
tools = ["adblock/resource-assembler"]

[dependencies]
# Brave's engine (network rules, cosmetic filters, scriptlets, redirects).
# Without "single-thread" the engine is Sync: WebView checks requests on
# several IO threads at once.
adblock = { version = "=0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = { version = "0.21", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
