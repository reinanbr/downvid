org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode (default since AGP 8): more aggressive shrinking/inlining.
android.enableR8.fullMode=true

# App version; CI overrides with DV_VERSION / DV_BUILD_NUMBER.
dv.versionName=0.2.0
dv.buildNumber=2
