name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  test:
    name: Tests (Go + Rust + Kotlin)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The ad blocker (Brave's adblock-rust); the tests include the
      # bundled engine (assets/adblock).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adblock

      - name: Rust tests
        working-directory: adblock
        run: |
          rustup target add aarch64-linux-android
          cargo test --release --locked

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go vet and tests
        working-directory: go
        run: |
          go vet ./...
          go test -race ./...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # The unit tests need the app compiled, which builds the Go core and
      # the ad blocker for one ABI first.
      - name: Kotlin unit tests
        working-directory: android
        env:
          DV_ABI: arm64-v8a
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  build:
    name: Build APKs
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adblock

      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: release APKs are signed with a temporary debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "DV_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "DV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DV_KEY_ALIAS=$KEY_ALIAS"
            echo "DV_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK (arm64)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          DV_ABI: arm64-v8a
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APKs (one per ABI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd android && DV_SPLIT=1 DV_VERSION="$version" DV_BUILD_NUMBER="${{ github.run_number }}" \
            ./gradlew --no-daemon :app:assembleRelease)
          mkdir -p dist
          # Stable file names: the README links to
          # releases/latest/download/DownVid-<abi>.apk, which always resolves
          # to the newest release. The version shows in the asset's label.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/DownVid-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # A missing CHANGELOG section must not block the APKs: the release
          # job falls back to GitHub's generated notes.
          scripts/changelog_section.sh "$version" > dist/RELEASE_NOTES.md \
            || { echo "::warning::No CHANGELOG.md section for $version"; : > dist/RELEASE_NOTES.md; }

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: downvid-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: downvid-release
          path: dist/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: downvid-release
          path: dist

      # Works both for `git push origin vX.Y.Z` (creates the release) and for
      # a release created on GitHub's site (only attaches the APKs, keeping
      # the notes written there).
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          files=()
          for apk in dist/*.apk; do
            abi="$(basename "$apk" .apk)"; abi="${abi#DownVid-}"
            files+=("$apk#DownVid $version · $abi")
          done
          files+=(dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            if [ -s dist/RELEASE_NOTES.md ]; then
              notes=(--notes-file dist/RELEASE_NOTES.md)
            else
              notes=(--generate-notes)
            fi
            # Tags such as v1.0.0-beta.1 are marked as pre-releases.
            pre=()
            [[ "$TAG" == *-* ]] && pre=(--prerelease)
            gh release create "$TAG" --verify-tag --title "DownVid $TAG" \
              "${notes[@]}" "${pre[@]}" "${files[@]}"
          fi
