name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.44.4"
  NDK_VERSION: "28.2.13676358"

jobs:
  test:
    name: Tests (Go + Dart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go vet and tests
        working-directory: go
        run: |
          go vet ./...
          go test -race ./internal/...

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dart analyze and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build:
    name: Build APKs
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: release APKs are signed with a temporary debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "DV_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "DV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DV_KEY_ALIAS=$KEY_ALIAS"
            echo "DV_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK (arm64)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter pub get
          DV_ABI=arm64-v8a flutter build apk --debug --target-platform android-arm64

      - name: Build release APKs (one per ABI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter pub get
          version="${GITHUB_REF_NAME#v}"
          DV_VERSION="$version" flutter build apk --release --split-per-abi \
            --build-name="$version" --build-number="${{ github.run_number }}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/DownVid-$version-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          scripts/changelog_section.sh "$version" > dist/RELEASE_NOTES.md

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: downvid-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: downvid-release
          path: dist/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: downvid-release
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: DownVid ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
