# Regenerate with: dart run ffigen --config ffigen.yaml
name: DvCoreBindings
description: Bindings for libdvcore.so (Go core). Generated by ffigen - do not edit.
output: lib/core/native/dvcore_bindings.g.dart
headers:
  entry-points:
    - go/include/dvcore.h
functions:
  include:
    - DV_.*
typedefs:
  include:
    - dv_event_cb
llvm-path:
  - /usr/lib/llvm-21
  - /usr/lib/llvm-18
  - /usr/lib/llvm-17
  - /usr/lib/llvm-16
  - /usr/lib/llvm-15
preamble: |
  // ignore_for_file: type=lint
macros:
  include:
    - DV_.*
structs:
  include:
    - dv_.*
unnamed-enums:
  include:
    - DV_.*
